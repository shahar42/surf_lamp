{% extends "base.html" %}

{% block content %}
  <h2>Register Your Lamp</h2>
  <p class="text-muted">Use the unique ID and initial password provided with your lamp.</p>
  <hr class="my-4"/>
  <form method="POST" action="{{ url_for('register') }}">
    <div class="mb-3">
      <label for="lamp_id" class="form-label">Lamp ID</label>
      <input type="text" class="form-control" id="lamp_id" name="lamp_id" required>
    </div>
    <div class="mb-3">
      <label for="initial_password" class="form-label">Initial Password</label>
      <input type="password" class="form-control" id="initial_password" name="initial_password" required>
    </div>
     <div class="mb-3">
      <label for="username" class="form-label">Choose a Username</label>
      <input type="text" class="form-control" id="username" name="username" required>
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Choose a Password</label>
      <input type="password" class="form-control" id="password" name="password" required>
    </div>
    <div class="mb-3">
      <label for="password2" class="form-label">Confirm Password</label>
      <input type="password" class="form-control" id="password2" name="password2" required>
    </div>
    <button type="submit" class="btn btn-primary mt-3">Register</button>
     <p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Log In</a></p>
  </form>
{% endblock %}
